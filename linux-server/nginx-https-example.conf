# Example only. Integrate into your existing Nginx HTTPS server block.
# You own TLS termination. Do not expose plain HTTP from the public Internet.
server {
  listen 443 ssl;
  server_name domain-b.example.com;
  ssl_certificate /etc/letsencrypt/live/domain-b.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/domain-b.example.com/privkey.pem;

  client_max_body_size 128k;
  location / {
    proxy_pass http://127.0.0.1:18765;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
}
