name: Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows-b/**'
      - 'windows-a/**'
      - 'linux-server/**'
      - 'tests/test_*.py'
      - 'tests/frozen_desktop_smoke.py'
      - 'scripts/build-desktop.ps1'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
      - name: Build and verify desktop EXE
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - name: Publish tested EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'desktop-' + $env:GITHUB_RUN_NUMBER + '-' + $env:GITHUB_RUN_ATTEMPT
          $notes = 'A/B desktop consoles, controlled C# Interop, diagnostic attachments. Upgrade NAS for new operations. No tokens or personal settings embedded. Source: ' + $env:GITHUB_SHA
          gh release create $tag dist/RemoteBHub.exe dist/RemoteBClient.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Remote B Hub $tag" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
